# contracts/artifact-frontmatter.yaml — output frontmatter schema
# Generated for `004-tier0-spacex-anchor` at program specification, 2026-09-18.
# Mirrors `theses/001-technology-baseline/contracts/artifact-frontmatter.yaml`, with the
# thesis_id const and pillar enum bound to this thesis. The five pins are unchanged and
# mandatory: an artifact missing any one is classified `resume` (partial-write class) by
# `dispatch.resume_verdict` and silently re-run — the filesystem is the checkpoint (Q56).
schema: artifact_frontmatter
version: 1

fields:
  thesis_id:      {type: str, required: true, const: "004-tier0-spacex-anchor"}
  pillar:         {type: str, required: true, enum: [PIL-1, PIL-2, PIL-3, PIL-4, PIL-5, PIL-6, cross]}
  ticker:         {type: str, required: true}
  skill:          {type: str, required: true}
  mode:           {type: str, required: true}
  generated_at:   {type: iso8601, required: true}

  # --- pins (Q33 / Q8 contract 5) — all five mandatory ---
  # ⚠️ `const: "1.4.0"` was left stale when 004 was RE-PINNED TO 1.5.0 at clarify round 2.
  # The spec header, §6, §7 Phase 1 and thesis.md were all updated; THIS FILE WAS NOT, so
  # every artifact carrying the current pin would have violated its own contract. Verified
  # 2026-09-19 against thesis.md (`constitution_pin: 1.5.0`) before the first dispatch.
  constitution_pin: {type: str, required: true, const: "1.5.0"}
  assumption_pin:   {type: str, required: true, const: "2"}
  skill_pin:        {type: str, required: true}
  as_of:            {type: date, required: true}
  corpus_version:   {type: str, required: true}

  # `data_class` — REQUIRED BY `g1_gate.check_frontmatter`, and absent from every thesis
  # contract here (001, 002, 003 and 004 all omit it), while 003's produced artifacts carry
  # no `data_class` and were accepted. So the gate is LATENT, not enforced on the path
  # 001–003 used. Declared anyway: it costs nothing and satisfies the gate if it ever runs.
  # Enum per `contracts/get-realtime-quote-tool.md`: market data is `fast` (Q72 — fast data
  # never triggers a rescan); filing-derived figures are `slow`.
  data_class:       {type: str, required: true, enum: [slow, fast]}

  # `key_metrics` — ⚠️ REQUIRED BY `synthesize_report.py pack`, and absent from 003's contract
  # too (it was added there after the fact, with the same warning). Without it on ANY artifact:
  #   `_require_metrics()` raises `MetricsMissingError: PACK REFUSED (Q97(1))`
  # **BEFORE writing anything** — the report pipeline cannot start at all.
  #
  # The refusal is deliberate. Its docstring records what happened before it existed: a thesis
  # whose artifacts lacked this produced *"an EMPTY `metrics.json` AND a success exit — the
  # report then rendered with no KPI tiles and nothing anywhere said why."*
  #
  # Measured 2026-09-19: 003 carried it on **45 files**; 004 on **0 of 21** until the report run
  # added it. That is exactly the silent failure the refusal was written to prevent, one thesis
  # later.
  #
  # SHAPE: a flat map of `metric_name: number`. These are the report's KPI tiles and its
  # `kpi_trend` chart inputs, so the VALUES MUST BE RAW — no percentages pre-multiplied, no
  # strings. `synthesize_report.py` reads them with no interpretation.
  key_metrics:
    type: map
    required: true
    value_type: number
    note: >
      Raw numbers only. A ratio goes in as 0.3859, not "38.59%". Names are snake_case and
      carry their own unit and period suffix, e.g. `space_launch_services_h1_2026_usd_m: 978`.

  # §1c standing rule: every artifact must label which definition it quotes.
  definitions_used:
    type: list
    required: true
    item:
      da_id: {type: str, required: true, pattern: "^DA-[0-9]{2}$"}
      chosen_reading: {type: str, required: true}
    min_items: 1

  # P4 evidence grading. A claim with no grade defaults to CLAIMED — never DEMONSTRATED.
  evidence_grade: {type: str, required: true, enum: [DEMONSTRATED, CLAIMED, MODELED, DERIVED]}

  # P11 — deal securities (IRDM, GSAT, RKLB) must be tagged.
  deal_security_basis: {type: str, required: false, enum: [standalone_pre_merger, post_close, not_applicable]}

  # Recorded when a pillar's wrong_if cannot be evaluated.
  # Class matters: see constitution §Disposition Classes (P4).
  unresolvable: {type: bool, required: false, default: false}
  unresolvable_class: {type: str, required: false, enum: [UNRESOLVABLE-FROM-PUBLIC-SOURCES, UNRESOLVABLE-FROM-PLATFORM]}

validation_rules:
  - id: da_id_registered
    rule: "every definitions_used[].da_id must exist in constitution §Data-Integrity Register (DA-23..DA-28) or 001 spec §1c (DA-01..DA-22)"
    level: fail
  - id: evidence_grade_present
    rule: "evidence_grade is required; absence is a fail, not a default"
    level: fail
  - id: pins_match_thesis
    rule: "constitution_pin / assumption_pin / as_of must match thesis.md frontmatter"
    level: fail
  - id: deal_security_tagging
    rule: "any artifact on IRDM, GSAT or RKLB must set deal_security_basis (P11)"
    level: fail
  - id: no_single_basis_collapse
    rule: >
      an artifact quoting a DA-registered metric must report every competing basis,
      not one. Quoting a single basis without the others is a §1c violation.
    level: fail
  - id: data_integrity_register_applied
    rule: >
      any artifact reading `operating_income` must show the component derivation
      (`gross profit − opex`) in-line, or invoke the gross-profit bound where the
      component identity is unavailable. `EPS × shares` is NOT an admissible sign
      test (constitution Data-Integrity Register, DA-23/28).
    level: fail
  - id: unresolvable_class_required
    rule: "unresolvable: true requires unresolvable_class — the two dispositions have different remedies"
    level: fail
